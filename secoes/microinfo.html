<!-- ============================================================
     Seção: microinfo  (agente: Fita)
     Fundo --cor-tinta · faixa fina · sem foto.
     Usa só tokens/classes do DS + microinfo.css (escopo .microinfo).
     Movimento registrado em secoes/microinfo.js (window.cenas).
     ============================================================ -->
<section id="microinfo" class="secao microinfo" aria-label="Disponibilidade e contacto">
  <div class="container microinfo__container">
    <ul class="microinfo__faixa aparece" role="list">
      <li class="microinfo__item">
        <span class="micro">Lisboa, Portugal</span>
      </li>

      <li class="microinfo__item" aria-hidden="true"><span class="microinfo__sep"></span></li>

      <li class="microinfo__item">
        <p class="selo"><span class="selo__ponto"></span> Agenda aberta</p>
      </li>

      <li class="microinfo__item" aria-hidden="true"><span class="microinfo__sep"></span></li>

      <li class="microinfo__item">
        <span class="micro" data-hora-lisboa aria-live="off">—:— em Lisboa</span>
      </li>

      <li class="microinfo__item" aria-hidden="true"><span class="microinfo__sep"></span></li>

      <li class="microinfo__item microinfo__item--fim">
        <a class="micro link-linha microinfo__ig"
           href="https://www.instagram.com/crisassistattoo/"
           target="_blank" rel="noopener">@crisassistattoo</a>
      </li>
    </ul>

    <!-- o traço do hero "escorre" por baixo da faixa e segue para a galeria -->
    <svg class="microinfo__traco" viewBox="0 0 1200 12" height="12"
         fill="none" preserveAspectRatio="none" aria-hidden="true" focusable="false">
      <path d="M0 6 L1200 6"/>
    </svg>
  </div>
</section>
