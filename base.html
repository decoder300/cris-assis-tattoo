  <!-- DM: copia uma mensagem pronta antes de abrir a conversa (o Instagram não aceita texto no link) -->
  <div class="aviso-dm" id="aviso-dm" role="status" aria-live="polite"></div>
  <script>
  (function(){
    var msg = 'Olá Cris! Vi o teu site e quero marcar uma tatuagem. A ideia é: ';
    var aviso = document.getElementById('aviso-dm'), t;
    function mostra(txt){ aviso.textContent = txt; aviso.classList.add('is-on'); clearTimeout(t); t = setTimeout(function(){ aviso.classList.remove('is-on'); }, 3200); }
    document.addEventListener('click', function(e){
      var a = e.target.closest && e.target.closest('a[href*="ig.me/m/"]');
      if (!a || !navigator.clipboard) return;
      navigator.clipboard.writeText(msg).then(function(){ mostra('Mensagem copiada — é só colar na DM e enviar'); }).catch(function(){});
    });
  })();
  </script>
